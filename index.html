<style>html,body{color:#1e2733;background:#d9d2c1;height:100%;margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}#game{touch-action:none;justify-content:center;align-items:center;width:100%;height:100%;display:flex;position:fixed;inset:0}#game canvas{max-width:100%;max-height:100%;image-rendering:pixelated;display:block}#hud-safe{pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);position:fixed;inset:0}#hud{pointer-events:none;--lb-top:0px;--lb-bottom:0px;--lb-left:0px;--lb-right:0px;--buff-left:20px;--buff-top:64px;color:#1e2733;-webkit-user-select:none;user-select:none;font-size:14px;position:absolute;inset:0}#hud .hud-only{display:none}#hud.hud-touch .hud-only{display:flex}#hud-stick{left:calc(16px + var(--lb-left));bottom:calc(16px + var(--lb-bottom));pointer-events:auto;touch-action:none;background:radial-gradient(circle,#e5dfd06b,#e5dfd038);border:2px solid #1e273357;border-radius:50%;width:132px;height:132px;position:absolute}#hud.hud-portrait #hud-stick{bottom:calc(16px + var(--lb-bottom));left:calc(20px + var(--lb-left))}#hud-stick-knob{background:#1e2733b8;border-radius:50%;width:52px;height:52px;margin:-26px 0 0 -26px;position:absolute;top:50%;left:50%;box-shadow:0 2px 8px #1e273338}#hud-acts{right:calc(16px + var(--lb-right));bottom:calc(16px + var(--lb-bottom));align-items:flex-end;gap:12px;display:flex;position:absolute}#hud button{pointer-events:auto;touch-action:none;font:inherit;color:#1e2733;background:#e5dfd0f0;border:2px solid #1e273347;border-radius:14px;flex-direction:column;justify-content:center;align-items:center;gap:2px;min-width:60px;min-height:60px;padding:8px 12px;display:flex}#hud button:hover{background:#ece6d8fa;border-color:#1e273373}#hud button:active{background:#d8e4e8fa;transform:translateY(1px);box-shadow:inset 0 1px #1e273340}#hud-fire{min-width:88px;min-height:88px;font-size:15px}#hud button small{opacity:.78;font-size:12px}#hud-backpack[data-count]:not([data-count="0"]):after{content:attr(data-count);color:#1e2733;text-align:center;background:#f0d68a;border-radius:10px;min-width:20px;height:20px;font-size:12px;line-height:20px;position:absolute;transform:translate(18px,-10px)}#hud-backpack{position:relative}#hud-backpack-panel{pointer-events:auto;z-index:8;color:#1e2733;background:#e5dfd0f7;border:2px solid #1e273347;border-radius:16px;width:min(520px,86vw);max-height:70vh;padding:16px 18px;display:none;position:absolute;top:50%;left:50%;overflow:auto;transform:translate(-50%,-50%)}#hud #hud-backpack-panel.show{display:block}#hud-backpack-panel h2{margin:0 0 10px;font-size:16px}#hud-backpack-list{grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;margin:0;padding:0;list-style:none;display:grid}#hud-backpack-list li{background:0 0;border-radius:10px;min-width:0;padding:0}#hud-backpack-list li.empty{opacity:.78;background:#1e273314;border-radius:8px;grid-column:1/-1;padding:12px;font-size:13px}#hud button.pack-slot{background:linear-gradient(160deg,#ece6d8eb,#d8e4e8eb);border:2px solid #1e273338;border-radius:10px;gap:3px;width:100%;min-width:0;min-height:82px;padding:6px 4px 5px;position:relative}#hud button.pack-slot.selected{background:#f0d68a52;border-color:#b87ae8}#hud button.pack-slot.bad{border-color:#c85050bf}.pack-icon{color:#1e2733;justify-content:center;align-items:center;width:34px;height:34px;font-size:16px;font-weight:800;line-height:1;display:flex}.pack-icon.k-new{clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(145deg,#a8e8f2,#39a9c4)}.pack-icon.k-up{background:linear-gradient(145deg,#ffe9ae,#d2a444);border-radius:10px}.pack-icon.k-pass{background:linear-gradient(145deg,#c6f2bf,#69b374);border-radius:50%}.pack-icon.k-heal{clip-path:polygon(50% 0,100% 18%,100% 62%,50% 100%,0 62%,0 18%);background:linear-gradient(145deg,#ffc8c0,#d87979)}.pack-icon.k-buff{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:linear-gradient(145deg,#e0c8ff,#9a76cc)}.pack-count{color:#1e2733;text-align:center;background:#f0d68a;border-radius:9px;min-width:18px;height:18px;font-size:12px;font-weight:700;line-height:18px;position:absolute;top:3px;right:4px}.pack-name{text-overflow:ellipsis;white-space:nowrap;max-width:100%;font-size:12px;line-height:1.2;overflow:hidden}.pack-state{opacity:.78;font-size:12px}.pack-state.bad{color:#a03030;opacity:1}#hud-item-detail{background:#1e273312;border:1px solid #1e27332e;border-radius:10px;min-height:48px;margin-top:12px;padding:10px 12px;font-size:12px;line-height:1.65}#hud-item-detail h3{color:#1e2733;margin:0 0 4px;font-size:13px}#hud-item-detail .row{opacity:.88;flex-wrap:wrap;gap:10px;display:flex}#hud-item-detail .hint{opacity:.66}#hud-buff-bar{left:var(--buff-left);top:var(--buff-top);pointer-events:none;z-index:6;align-items:center;gap:6px;display:flex;position:fixed}#hud-buff-label{opacity:.72;letter-spacing:1px;padding:0 2px;font-size:12px}#hud button.buff-icon{pointer-events:auto;background:#e5dfd0f0;border:2px solid #1e273357;border-radius:12px;justify-content:center;align-items:center;width:44px;min-width:0;height:44px;min-height:0;padding:0;display:flex;position:relative}#hud button.buff-icon.selected{border-color:#b87ae8;box-shadow:0 0 0 2px #b87ae847}.bglyph{color:#1e2733;justify-content:center;align-items:center;width:30px;height:30px;font-size:14px;font-weight:800;display:flex}.buff-icon[data-buff=rage] .bglyph{clip-path:polygon(50% 0,100% 42%,84% 100%,16% 100%,0 42%);background:linear-gradient(145deg,#ffb182,#dc6a3c)}.buff-icon[data-buff=swift] .bglyph{clip-path:polygon(50% 0,63% 36%,100% 50%,63% 64%,50% 100%,37% 64%,0 50%,37% 36%);background:linear-gradient(145deg,#a8ecf6,#4aa6c6)}.buff-icon[data-buff=greed] .bglyph{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:linear-gradient(145deg,#ffe9ae,#d2a444)}.buff-icon[data-buff=other] .bglyph{background:#c8a8f0;border-radius:9px}.bleft{color:#faf6ec;text-align:center;background:#1e2733;border-radius:8px;min-width:19px;height:16px;font-size:12px;line-height:16px;position:absolute;bottom:-4px;right:-4px}#hud-buff-detail{left:var(--buff-left);top:calc(var(--buff-top) + 52px);pointer-events:auto;z-index:7;color:#1e2733;background:#e5dfd0f7;border:1px solid #b87ae880;border-radius:10px;width:min(280px,72vw);padding:10px 12px;font-size:12px;line-height:1.65;display:none;position:fixed}#hud-buff-detail.show{display:block}#hud-buff-detail h3{color:#1e2733;margin:0 0 4px;font-size:13px}#hud-fullscreen{left:calc(16px + var(--lb-left));bottom:calc(16px + var(--lb-bottom));z-index:6;min-width:64px;font-size:13px;display:none;position:fixed}#hud.hud-landscape #hud-fullscreen{display:flex}#hud.hud-landscape.hud-touch #hud-fullscreen{left:calc(164px + var(--lb-left))}#hud.hud-landscape #hud-acts{display:flex}#hud-pause-panel{pointer-events:auto;color:#1e2733;background:#e5dfd0f5;border:2px solid #1e273347;border-radius:18px;flex-direction:column;align-items:center;gap:14px;padding:22px 26px;display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}#hud.hud-touch #hud-pause-panel.show{display:flex}#hud-pause-panel h2{margin:0;font-size:17px}#hud-pause-panel .row{gap:14px;display:flex}#hud-rotate{text-align:center;pointer-events:none;color:#1e2733;background:#e4e9eee6;flex-direction:column;justify-content:center;align-items:center;gap:14px;padding:24px;font-size:17px;display:none;position:absolute;inset:0}#hud-rotate.show{display:flex}#hud-rotate .rot-icon{border:3px solid #1e2733;border-radius:12px;width:64px;height:96px;animation:2.2s ease-in-out infinite hud-turn}@keyframes hud-turn{0%,40%{transform:rotate(0)}70%,to{transform:rotate(-90deg)}}#hud-rotate small{opacity:.78;font-size:13px}</style>

<body>
  <div id="game"></div>
  <div id="hud-safe">
    <!-- DOM 操控层（阶段 1d）：#hud-safe 只负责安全区 padding，定位与命中都在 #hud 里 -->
    <div id="hud">
      <div id="hud-stick" class="hud-only"><i id="hud-stick-knob"></i></div>
      <div id="hud-acts" class="hud-only">
        <button id="hud-pause" type="button">暂停<small>Esc / P</small></button>
        <button id="hud-backpack" type="button" data-count="0">背包<small>B</small></button>
        <button id="hud-fire" type="button">射击<small>按住 / 空格</small></button>
      </div>
      <button id="hud-fullscreen" type="button" aria-pressed="false">
        <span id="hud-fs-label">全屏</span><small>横屏切换</small>
      </button>
      <!-- 加成 buff 固定栏：位置由 relayout() 锚到经验条下方 -->
      <div id="hud-buff-bar"><span id="hud-buff-label">增益</span></div>
      <div id="hud-buff-detail"></div>
      <div id="hud-backpack-panel">
        <h2>背包</h2>
        <ul id="hud-backpack-list"></ul>
        <div id="hud-item-detail"></div>
      </div>
      <div id="hud-pause-panel">
        <h2>已暂停</h2>
        <div class="row">
          <button id="hud-resume" type="button">继续</button>
          <button id="hud-restart" type="button">重开</button>
        </div>
      </div>
      <div id="hud-rotate"><div class="rot-icon"></div>请横屏继续<small>竖屏下画面仅 390×219，触控目标太小</small></div>
    </div>
  </div>
</body>
